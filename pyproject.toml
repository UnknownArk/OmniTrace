[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-trace"
version = "0.1.0"
description = "Autonomous Hybrid Intelligence Engine: Unifying Structured SQL Telemetry with Unstructured Document RAG via Self-Healing Tool Loops & Evaluation Harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "groq>=0.9.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "rich>=13.0.0",
    "numpy>=1.26.0",
]

[tool.setuptools.packages.find]
include = ["omni_trace*"]

[tool.pytest.ini_options]
testpaths = ["evals"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
